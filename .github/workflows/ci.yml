# Builds and tests every push: unit tests, then the speech pipeline with the
# real models and the synthetic test voices (models cached between runs).
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    # The first run builds sherpa-onnx with DirectML (cached afterwards).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # The compiled sherpa-onnx-sys crate contains the DirectML libraries:
      # a new build script means a new cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: sherpa-${{ hashFiles('scripts/build-sherpa-directml.ps1') }}

      - name: Cache sherpa-onnx with DirectML
        id: native
        uses: actions/cache@v4
        with:
          path: src-tauri/native/sherpa-onnx
          key: sherpa-directml-${{ hashFiles('scripts/build-sherpa-directml.ps1') }}

      - name: Build sherpa-onnx with DirectML
        if: steps.native.outputs.cache-hit != 'true'
        shell: pwsh
        run: scripts/build-sherpa-directml.ps1 -WorkDir "${{ runner.temp }}\scripta-build"

      - run: npm ci

      - name: Type check the UI
        run: npm run check

      - name: Build the UI
        run: npm run build

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Cache the speech models
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\io.github.saibot-strg.scripta\Models
          key: models-${{ hashFiles('src-tauri/src/models.rs') }}

      - name: Download the models
        working-directory: src-tauri
        run: cargo run --release --example models

      - name: Speech pipeline tests
        working-directory: src-tauri
        run: cargo test --release --test end_to_end -- --test-threads=1 --nocapture
